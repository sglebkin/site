:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html > body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: var(--visualize-paint-gutter, 0px);
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

.cursor-interaction {
  cursor: var(--cursor-interaction, pointer);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: var(--cursor-interaction, pointer);
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align="right"]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align="center"]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget > :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {
  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls > .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls > .form-label > :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: var(--cursor-interaction, pointer);
  text-decoration: none;
}

.btn:not(:disabled):hover,
.nav-link:not(:disabled):not([aria-disabled="true"]):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);
}

/* Shared preview chrome; product styles stay inside each variant. */
.viz-dotted-background {
  background-image: radial-gradient(
    circle,
    color-mix(in srgb, var(--foreground) 14%, transparent) 0.8px,
    transparent 0.8px
  );
  background-position: center;
  background-size: 16px 16px;
}

.viz-carousel {
  position: relative;
  min-width: 0;
}

.viz-carousel:has(> .viz-carousel-controls) {
  min-height: calc(60px + var(--viz-carousel-picker-height, 0px));
  padding-bottom: 60px;
}

.viz-carousel > [data-variant][hidden] {
  display: none !important;
}

.viz-carousel > [data-variant] {
  isolation: isolate;
}

.viz-carousel-controls {
  --viz-carousel-hover: light-dark(
    color-mix(in srgb, var(--foreground) 5.4%, transparent),
    color-mix(in srgb, var(--foreground) 7.8%, transparent)
  );
  position: absolute;
  z-index: 2;
  bottom: 8px;
  left: 50%;
  display: flex;
  width: max-content;
  /* Leave room for the host's design-controls launcher at the trailing edge. */
  max-width: calc(100% - 96px);
  align-items: center;
  gap: 0;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-sans);
  /* Match the settings dropdown chrome independently of the content font size. */
  font-size: 13px;
  font-weight: var(--font-weight-normal);
  line-height: 18px;
  transform: translateX(-50%);
  user-select: none;
}

.viz-carousel-controls button,
.viz-carousel-picker > summary {
  display: flex;
  min-height: 30px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 0 6px;
  -webkit-app-region: no-drag;
  border: 0;
  border-radius: 14px;
  color: inherit;
  background: transparent;
  font: inherit;
  -webkit-tap-highlight-color: transparent;
}

.viz-carousel-controls > button,
.viz-carousel-picker > summary {
  position: relative;
  isolation: isolate;
}

.viz-carousel-controls > button {
  --icon-size: 16px;
  width: 30px;
  padding: 0;
}

.viz-carousel-picker > summary {
  padding-inline: 12px;
}

.viz-carousel-controls .viz-carousel-caret {
  width: 14px;
  height: 14px;
  flex: none;
  margin: 0;
  color: inherit;
  transform: rotate(180deg);
}

.viz-carousel-controls > button > svg,
.viz-carousel-controls .viz-carousel-caret,
.viz-carousel-count {
  opacity: 0.5;
}

.viz-carousel-controls > button::before,
.viz-carousel-picker > summary::before {
  position: absolute;
  z-index: -1;
  inset: 3px;
  border-radius: 12px;
  content: "";
  pointer-events: none;
}

.viz-carousel-controls > button:hover::before,
.viz-carousel-picker > summary:hover::before {
  background: var(--viz-carousel-hover);
}

.viz-carousel-controls > button,
.viz-carousel-controls [data-lucide],
.viz-carousel-controls .lucide {
  flex-shrink: 0;
}

.viz-carousel-picker {
  min-width: 0;
}

.viz-carousel-picker > summary {
  min-width: 0;
  list-style: none;
}

.viz-carousel-picker > summary::-webkit-details-marker {
  display: none;
}

.viz-carousel-count {
  flex-shrink: 0;
  white-space: nowrap;
}

.viz-carousel-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.viz-carousel-options {
  position: absolute;
  right: 0;
  bottom: calc(100% + 4px);
  left: 0;
  display: flex;
  max-height: 240px;
  flex-direction: column;
  gap: 2px;
  overflow: auto;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--background);
  box-shadow: 0 4px 12px light-dark(rgb(0 0 0 / 6%), rgb(0 0 0 / 25%));
}

.viz-carousel-options > button {
  width: 100%;
  min-height: 28px;
  justify-content: flex-start;
  padding: 4px 8px;
  font-size: var(--font-size-small);
  text-align: start;
  white-space: normal;
  overflow-wrap: anywhere;
}

.viz-carousel-options > [aria-current="true"],
.viz-carousel-options > button:hover {
  background: var(--viz-carousel-hover);
}

.btn:disabled,
.nav-link:disabled,
.nav-link[aria-disabled="true"] {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type="file"] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type="file"]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type="file"]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type="color"] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type="color"]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type="checkbox"]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: "";
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type="radio"] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type="radio"]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed="true"],
  [aria-selected="true"],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible,
.viz-carousel-controls :is(button, summary):focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .viz-carousel:has(> .viz-carousel-controls) {
    min-height: calc(76px + var(--viz-carousel-picker-height, 0px));
    padding-bottom: 76px;
  }

  .btn,
  .nav-link,
  .viz-carousel-controls button,
  .viz-carousel-picker > summary,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type="file"]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type="color"] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type="date"],
    [type="datetime-local"],
    [type="month"],
    [type="time"],
    [type="week"]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: "";
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget > svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  <script>
  (() => {
    const root = document.getElementById('quadratic-concentration');
    const data = JSON.parse(root.querySelector('.qc-data').textContent);
    const canvas = root.querySelector('canvas');
    const context = canvas.getContext('2d');
    const counter = root.querySelector('.qc-counter');
    const live = root.querySelector('.qc-live');
    const previous = root.querySelector('.qc-previous');
    const next = root.querySelector('.qc-next');
    const play = root.querySelector('.qc-play');
    const probe = root.querySelector('.qc-probe');
    const names = data.sharedScale ? {row: "S'", matrix: 'A', column: 'S', intermediate: "S'A", product: "S'AS"}
                                   : {row: 'Sᵀ', matrix: 'Ψ', column: 'S', intermediate: 'SᵀΨ', product: 'SᵀΨS'};
    if (data.sharedScale) root.querySelector('h2').textContent = `Concentration of ${names.product}`;
    if (data.unitCells) {
      root.querySelector('.qc-caption').textContent = data.sharedScale
        ? `${data.visible} coordinates displayed · products use all ${data.n.toLocaleString()}`
        : `${data.visible} coordinates displayed; products use all ${data.n.toLocaleString()} · equal-sized square cells`;
    }
    const unpack = value => {
      const bytes = Uint8Array.from(atob(value), character => character.charCodeAt(0));
      return data.encoding === 'float32' ? new Float32Array(bytes.buffer) : bytes;
    };
    const frames = data.frames.map(frame => ({
      s: unpack(frame.s), matrix: unpack(frame.matrix),
      intermediate: unpack(frame.intermediate), value: frame.value
    }));
    let index = 0;
    let timer = null;

    function color(token) {
      probe.style.color = `var(${token})`;
      const resolved = getComputedStyle(probe).color;
      const values = resolved.match(/[\d.]+/g).map(Number);
      return values.length > 3 ? blend(color('--background'), values.slice(0, 3), values[3]) : values;
    }
    function blend(a, b, fraction) {
      return a.map((value, i) => Math.round(value + (b[i] - value) * fraction));
    }
    function rgb(value) { return `rgb(${value.join(',')})`; }
    function theme() {
      const background = color('--background');
      const foreground = color('--foreground');
      const neutral = blend(background, foreground, .035);
      const negative = color('--blue');
      const positive = color('--orange');
      const output = color('--viz-series-1');
      const common = value => {
        const position = Math.asinh(value / data.colorSoftness) / Math.asinh(data.colorLimit / data.colorSoftness);
        const bounded = Math.max(-1, Math.min(1, position));
        return rgb(bounded < 0 ? blend(neutral, negative, -bounded) : blend(neutral, positive, bounded));
      };
      return {
        background, foreground, neutral, negative, positive, output,
        muted: color('--muted-foreground'), line: blend(background, foreground, .24),
        signed: Array.from({length: 256}, (_, i) => rgb(i < 128
          ? blend(negative, neutral, i / 127)
          : blend(neutral, positive, (i - 128) / 127))),
        valueColor: data.sharedScale ? common : null,
        scalar: data.sharedScale ? common : value => rgb(blend(background, output, .18 + .78 * Math.max(0, Math.min(1, (value - data.eigenMin) / (data.eigenMax - data.eigenMin)))))
      };
    }

    function draw() {
      const width = Math.max(280, root.clientWidth);
      const narrow = width < 620;
      const unitCell = Math.max(3, Math.floor(narrow ? (width - 100) / data.visible : (width - 238) / (2 * data.visible + 1)));
      const unitSize = unitCell * data.visible;
      const height = data.unitCells ? unitSize + (narrow ? (data.sharedScale ? 484 : 440) : (data.sharedScale ? 260 : 285))
                                   : narrow ? 676 : Math.round(270 + Math.min(256, (width - 32) * .30));
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      canvas.style.height = `${height}px`;
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      context.clearRect(0, 0, width, height);
      const palette = theme();
      const frame = frames[index];
      const styles = getComputedStyle(root);
      const baseFont = styles.fontSize;
      const smallFont = getComputedStyle(counter).fontSize;
      const family = styles.fontFamily;

      function text(value, x, y, align = 'center', muted = false, small = false) {
        context.font = `400 ${small ? smallFont : baseFont} ${family}`;
        context.textAlign = align;
        context.textBaseline = 'middle';
        context.fillStyle = rgb(muted ? palette.muted : palette.foreground);
        context.fillText(value, x, y);
      }
      function line(points, arrow = false) {
        context.strokeStyle = rgb(palette.line);
        context.lineWidth = 1;
        context.beginPath();
        points.forEach(([x, y], i) => i ? context.lineTo(x, y) : context.moveTo(x, y));
        context.stroke();
        if (arrow) {
          const [x, y] = points[points.length - 1];
          context.beginPath();
          context.moveTo(x - 4, y + 5); context.lineTo(x, y); context.lineTo(x + 4, y + 5);
          context.stroke();
        }
      }
      function heatmap(values, columns, rows, x, y, boxWidth, boxHeight) {
        const cellWidth = boxWidth / columns, cellHeight = boxHeight / rows;
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < columns; col++) {
            context.fillStyle = palette.valueColor ? palette.valueColor(values[row * columns + col])
                                                   : palette.signed[values[row * columns + col]];
            const left = Math.round(x + col * cellWidth), top = Math.round(y + row * cellHeight);
            const right = Math.round(x + (col + 1) * cellWidth), bottom = Math.round(y + (row + 1) * cellHeight);
            context.fillRect(left, top, right - left, bottom - top);
          }
        }
      }
      function legend(x, y, legendWidth, label, minimum, maximum, scalar = false) {
        text(label, x, y, 'left', true, true);
        for (let i = 0; i < legendWidth; i++) {
          context.fillStyle = scalar ? palette.scalar(data.eigenMin + (data.eigenMax - data.eigenMin) * i / (legendWidth - 1))
                                     : palette.signed[Math.round(i * 255 / (legendWidth - 1))];
          context.fillRect(x + i, y + 13, 1.2, 9);
        }
        text(minimum, x, y + 35, 'left', true, true);
        text(maximum, x + legendWidth, y + 35, 'right', true, true);
        if (!scalar && legendWidth >= 100) text('0', x + legendWidth / 2, y + 35, 'center', true, true);
      }
      function scalar(x, y, size, titleY, valueY, targetY) {
        text('SᵀΨS', x + size / 2, titleY);
        context.fillStyle = palette.scalar(frame.value);
        context.fillRect(x, y, size, size);
        text(frame.value.toFixed(4), x + size / 2, valueY);
      }

      function sharedLegend(x, y, legendWidth) {
        text('Color scale', x + legendWidth / 2, y, 'center', true, true);
        const span = Math.asinh(data.colorLimit / data.colorSoftness);
        for (let i = 0; i < legendWidth; i++) {
          const value = data.colorSoftness * Math.sinh((2 * i / (legendWidth - 1) - 1) * span);
          context.fillStyle = palette.valueColor(value);
          context.fillRect(x + i, y + 14, 1.1, 10);
        }
        for (const value of [-1.8, -.1, 0, .1, 1.8]) {
          const position = .5 + Math.asinh(value / data.colorSoftness) / (2 * span);
          const label = value < 0 ? `−${Math.abs(value)}` : `${value}`;
          text(label, x + position * legendWidth, y + 39,
               value === -1.8 ? 'left' : value === 1.8 ? 'right' : 'center', true, true);
        }
      }

      if (data.unitCells) {
        const cell = unitCell, size = unitSize;
        const resultSize = data.sharedScale ? 56 : cell;
        root.dataset.geometry = JSON.stringify({cell, displayed: data.visible,
          row: [size, cell], matrix: [size, size], column: [cell, size],
          intermediate: [size, cell], scalar: [resultSize, resultSize], enlargedScalar: Boolean(data.sharedScale)});
        if (!narrow) {
          const contentWidth = 2 * size + cell + 206;
          const start = (width - contentWidth) / 2;
          const matrixX = start + size + 36, matrixY = 145;
          const columnX = matrixX + size + 32;
          const resultX = columnX + cell + 34;
          const resultCenter = resultX + 52;
          const centerY = matrixY + size / 2;
          text(data.sharedScale ? names.intermediate : 'SᵀΨ · 1 × N', matrixX + size / 2, 25);
          heatmap(frame.intermediate, data.visible, 1, matrixX, 49, size, cell);
          line([[start, 96], [start, 88], [matrixX + size, 88], [matrixX + size, 96]]);
          line([[matrixX + size / 2, 88], [matrixX + size / 2, 49 + cell + 8]], true);
          text(data.sharedScale ? names.row : 'Sᵀ · 1 × N', start + size / 2, centerY - 25);
          heatmap(frame.s, data.visible, 1, start, centerY - cell / 2, size, cell);
          text('×', start + size + 18, centerY);
          text(data.sharedScale ? names.matrix : 'Ψ · N × N', matrixX + size / 2, matrixY - 24);
          heatmap(frame.matrix, data.visible, data.visible, matrixX, matrixY, size, size);
          text('×', matrixX + size + 16, centerY);
          text(data.sharedScale ? names.column : 'S · N × 1', columnX + cell / 2, matrixY - 24);
          heatmap(frame.s, 1, data.visible, columnX, matrixY, cell, size);
          text('=', columnX + cell + 17, centerY);
          text(names.product, resultCenter, centerY - resultSize / 2 - 24);
          if (!data.sharedScale) text('1 × 1', resultCenter, centerY - 23, 'center', true, true);
          context.fillStyle = palette.scalar(frame.value);
          context.fillRect(Math.round(resultCenter - resultSize / 2), Math.round(centerY - resultSize / 2), resultSize, resultSize);
          text(frame.value.toFixed(4), resultCenter, centerY + resultSize / 2 + 24);
          const legendY = matrixY + size + 43;
          if (data.sharedScale) {
            const legendWidth = Math.min(400, width - 64);
            sharedLegend((width - legendWidth) / 2, legendY, legendWidth);
          } else {
          legend(start, legendY, Math.min(148, size), 'S and SᵀΨ entries', '−0.07', '+0.07');
          legend(matrixX, legendY, Math.min(148, size), 'Ψ entries', '−0.035', '+0.035');
          const scalarLegendWidth = Math.min(116, width - resultX - 16);
          legend(resultX, legendY, scalarLegendWidth, 'Scalar color', '0.2', '1.8', true);
          text('One matrix entry = one vector entry = one scalar cell', start, height - 31, 'left', true, true);
          text('Fixed color scales; entry colors clipped at the limits', start, height - 12, 'left', true, true);
          }
        } else {
          const matrixX = (width - size - 36 - cell) / 2;
          const columnX = matrixX + size + 36;
          const matrixY = 116;
          text(data.sharedScale ? names.row : 'Sᵀ · 1 × N', matrixX + size / 2, 19);
          heatmap(frame.s, data.visible, 1, matrixX, 40, size, cell);
          text('×', matrixX + size / 2, 72);
          text(data.sharedScale ? names.matrix : 'Ψ · N × N', matrixX + size / 2, 96);
          text('S', columnX + cell / 2, 96);
          heatmap(frame.matrix, data.visible, data.visible, matrixX, matrixY, size, size);
          text('×', matrixX + size + 18, matrixY + size / 2);
          heatmap(frame.s, 1, data.visible, columnX, matrixY, cell, size);
          const bottom = matrixY + size;
          text(data.sharedScale ? names.intermediate : 'SᵀΨ · 1 × N', matrixX + size / 2, bottom + 40);
          heatmap(frame.intermediate, data.visible, 1, matrixX, bottom + 62, size, cell);
          text('=', width / 2, bottom + 100);
          text(data.sharedScale ? names.product : 'SᵀΨS · 1 × 1', width / 2, bottom + 134);
          context.fillStyle = palette.scalar(frame.value);
          context.fillRect(Math.round((width - resultSize) / 2), bottom + 156, resultSize, resultSize);
          const resultBottom = data.sharedScale ? bottom + 156 + resultSize : bottom + 160;
          text(frame.value.toFixed(4), width / 2, resultBottom + 24);
          if (data.sharedScale) {
            sharedLegend(20, resultBottom + 87, width - 40);
          } else {
          const legendWidth = (width - 60) / 3, legendY = bottom + 242;
          legend(16, legendY, legendWidth, 'S, SᵀΨ', '−.07', '+.07');
          legend(30 + legendWidth, legendY, legendWidth, 'Ψ entries', '−.035', '+.035');
          legend(44 + 2 * legendWidth, legendY, legendWidth, 'Scalar', '0.2', '1.8', true);
          text('Equal square cells in every factor', 16, height - 30, 'left', true, true);
          text('Fixed scales; entry colors clipped', 16, height - 12, 'left', true, true);
          }
        }
      } else if (!narrow) {
        const margin = 16, available = width - 32;
        const size = Math.min(256, available * .30);
        const matrixX = margin + available * .29, matrixY = 138;
        const centerY = matrixY + size / 2;
        const rowWidth = available * .225;
        const bar = 18;
        const columnX = margin + available * .66;
        const scalarSize = Math.min(58, available * .079);
        const scalarX = margin + available * .865 - scalarSize / 2;

        text('SᵀΨ', matrixX + size / 2, 24);
        heatmap(frame.intermediate, data.visible, 1, matrixX, 43, size, bar);
        const bracketY = 89;
        line([[margin, bracketY + 8], [margin, bracketY], [matrixX + size, bracketY], [matrixX + size, bracketY + 8]]);
        line([[matrixX + size / 2, bracketY], [matrixX + size / 2, 68]], true);

        text('Sᵀ', margin + rowWidth / 2, centerY - 31);
        heatmap(frame.s, data.visible, 1, margin, centerY - bar / 2, rowWidth, bar);
        text('×', margin + available * .258, centerY);
        text('Ψ', matrixX + size / 2, matrixY - 20);
        heatmap(frame.matrix, data.visible, data.visible, matrixX, matrixY, size, size);
        text('×', margin + available * .625, centerY);
        text('S', columnX + bar / 2, matrixY - 20);
        heatmap(frame.s, 1, data.visible, columnX, matrixY, bar, size);
        text('=', margin + available * .73, centerY);
        scalar(scalarX, centerY - scalarSize / 2, scalarSize, centerY - scalarSize / 2 - 24,
               centerY + scalarSize / 2 + 24, centerY + scalarSize / 2 + 45);
        const legendY = matrixY + size + 42;
        const legendWidth = Math.min(148, available * .21);
        legend(margin, legendY, legendWidth, 'S and SᵀΨ entries', '−0.07', '+0.07');
        legend(matrixX, legendY, legendWidth, 'Ψ entries', '−0.035', '+0.035');
        legend(margin + available * .76, legendY, Math.min(144, available * .22), 'Scalar color', '0.2', '1.8', true);
        text('Fixed color scales · entry colors clipped at the limits', margin, height - 15, 'left', true, true);
      } else {
        const margin = 16, available = width - 32;
        const size = Math.min(210, available - 68);
        const matrixX = margin + (available - size - 60) / 2;
        const columnX = matrixX + size + 36;
        const bar = 18;
        text('Sᵀ', width / 2, 19);
        heatmap(frame.s, data.visible, 1, matrixX, 36, size, bar);
        text('×', width / 2, 77);
        text('Ψ', matrixX + size / 2, 103);
        text('S', columnX + bar / 2, 103);
        heatmap(frame.matrix, data.visible, data.visible, matrixX, 121, size, size);
        text('×', matrixX + size + 18, 121 + size / 2);
        heatmap(frame.s, 1, data.visible, columnX, 121, bar, size);
        const resultY = 121 + size + 45;
        text('SᵀΨ', matrixX + size / 2, resultY);
        heatmap(frame.intermediate, data.visible, 1, matrixX, resultY + 19, size, bar);
        text('=', width / 2, resultY + 64);
        scalar(width / 2 - 23, resultY + 104, 46, resultY + 86, resultY + 171, resultY + 191);
        const legendY = 590;
        const legendWidth = (available - 28) / 3;
        legend(margin, legendY, legendWidth, 'S, SᵀΨ', '−.07', '+.07');
        legend(margin + legendWidth + 14, legendY, legendWidth, 'Ψ entries', '−.035', '+.035');
        legend(margin + 2 * (legendWidth + 14), legendY, legendWidth, 'Scalar', '0.2', '1.8', true);
        text('Fixed scales; entry colors clipped', margin, 658, 'left', true, true);
      }

      counter.textContent = `Draw ${String(index + 1).padStart(2, '0')} / ${data.count}`;
      live.textContent = `${names.product} = ${frame.value.toFixed(4)}`;
      canvas.setAttribute('aria-label', `Draw ${index + 1}. Random unit vector and symmetric matrix in ${data.n} dimensions, with eigenvalues fixed between ${data.eigenMin} and ${data.eigenMax}. Their scalar quadratic form is ${frame.value.toFixed(4)}, close to its expectation ${data.target}.`);
      previous.disabled = index === 0;
      root.dataset.draw = String(index);
      root.dataset.value = String(frame.value);
    }

    function save() {
      if (window.openai && window.openai.setWidgetState) {
        window.openai.setWidgetState({modelContent: {draw: index + 1, dimension: data.n, quadraticForm: frames[index].value}, privateContent: {index}}).catch(() => {});
      }
    }
    function stop() {
      if (timer !== null) clearInterval(timer);
      timer = null;
      play.textContent = 'Play sequence';
      play.setAttribute('aria-pressed', 'false');
      live.setAttribute('aria-live', 'polite');
    }
    function select(newIndex, persist = true) {
      index = Math.max(0, Math.min(data.count - 1, newIndex));
      draw();
      if (persist) save();
    }
    previous.addEventListener('click', () => { stop(); select(index - 1); });
    next.addEventListener('click', () => { stop(); select((index + 1) % data.count); });
    play.addEventListener('click', () => {
      if (timer !== null) { stop(); save(); return; }
      if (index === data.count - 1) select(0);
      play.textContent = 'Pause';
      play.setAttribute('aria-pressed', 'true');
      live.setAttribute('aria-live', 'off');
      const interval = matchMedia('(prefers-reduced-motion: reduce)').matches ? 2000 : 1100;
      timer = setInterval(() => {
        if (index >= data.count - 1) { stop(); save(); return; }
        select(index + 1, false);
        if (index === data.count - 1) { stop(); save(); }
      }, interval);
    });
    function restore(state) {
      const restored = state && state.privateContent && state.privateContent.index;
      if (Number.isInteger(restored) && restored >= 0 && restored < data.count) {
        stop(); select(restored, false);
      }
    }
    if (window.openai) restore(window.openai.widgetState);
    window.addEventListener('openai:set_globals', event => restore(event.detail && event.detail.globals && event.detail.globals.widgetState));
    document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); });
    new ResizeObserver(draw).observe(root);
    new MutationObserver(draw).observe(document.documentElement, {attributes: true, attributeFilter: ['class', 'style', 'data-theme']});
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
    draw();
  })();
  </script>
</div>

  </div>
  <script>
    (() => {
      const illustration = document.getElementById('quadratic-concentration');
      const stage = document.querySelector('.rmt-stage');
      const toolbar = document.querySelector('.rmt-display-controls');
      const size = document.getElementById('rmt-size');
      function fit() {
        const padding = getComputedStyle(document.body);
        const availableWidth = document.documentElement.clientWidth - parseFloat(padding.paddingLeft) - parseFloat(padding.paddingRight);
        const width = Math.max(1, Math.min(Number(size.value), availableWidth));
        illustration.style.width = width + 'px';
        const height = Math.max(1, illustration.scrollHeight);
        const viewportHeight = window.visualViewport?.height || window.innerHeight;
        const top = stage.getBoundingClientRect().top + window.scrollY;
        const availableHeight = Math.max(1, viewportHeight - top - parseFloat(padding.paddingBottom) - 2);
        const scale = Math.min(1, availableHeight / height);
        illustration.style.transform = `scale(${scale})`;
        stage.style.width = width * scale + 'px';
        stage.style.height = height * scale + 'px';
        toolbar.style.maxWidth = Math.max(160, width * scale) + 'px';
      }
      size.addEventListener('change', fit);
      window.addEventListener('resize', fit);
      window.visualViewport?.addEventListener('resize', fit);
      new ResizeObserver(fit).observe(illustration);
      fit();
    })();
  </script>
</body>
</html>
